name: build and publish 0.1.4

on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-publish-0.1.4.yml']

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump patch version
        run: npm version 0.1.4 --no-git-tag-version
      - run: npm test
      - run: npm run build
      - run: npm run build:pwa
      - name: Commit release version
        id: commit
        run: |
          git config user.name 'SabotPress contributors'
          git config user.email 'sabotmedia@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'release 0.1.4 prep'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            command: npm run desktop:dist:win -- --publish never
          - os: macos-latest
            name: macos-arm64
            command: npm run desktop:dist:mac -- --arm64 --publish never
          - os: macos-latest
            name: macos-x64
            command: npm run desktop:dist:mac -- --x64 --publish never
          - os: ubuntu-latest
            name: linux-x64
            command: npm run desktop:dist:linux -- --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-0.1.4
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Tag 0.1.4
        run: |
          git tag v0.1.4 "${{ needs.prepare.outputs.sha }}"
          git push origin v0.1.4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build SHA-256 checksum file
        run: |
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  artifacts/[^/]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.4
          name: SabotPress 0.1.4
          body: |
            Desktop and browser usability cleanup from hands-on testing.

            - Keeps install, hosting, collective-host, server, Noblogs migration and backup help inside SabotPress instead of sending ordinary users into repository docs.
            - Removes the legacy public-page recovery panel from normal Settings. The old recovery utility remains in the source for unusual upgrade recovery, but it is no longer normal setup UI.
            - Clarifies that desktop publication data intentionally survives app upgrades/reinstalls because it lives in the SabotPress application-data folder. Reinstalling is not a factory reset.
            - Makes backup behavior explicit: SabotPress does not currently run a configurable automatic backup schedule. Portable and server exports are manual; browser-local mode reminds users when a recent portable backup is missing.
            - Adds SHA256SUMS.txt to the release so unsigned installers can be verified directly.
            - Keeps the 0.1.3 logo upload, publication-settings save, corrected desktop routes, local auth and fresh campaign API fixes.

            ### Unsigned desktop builds
            SabotPress distributes unsigned desktop builds so the project does not require paid code-signing services or publisher identity verification.

            **Windows:** SmartScreen may identify SabotPress as an unrecognized app. Click **More info**, then **Run anyway** after verifying the download and its SHA-256 checksum against `SHA256SUMS.txt`.

            **macOS:** Gatekeeper may block first launch of an unsigned build. Use Finder's **Open** action or Privacy & Security controls after verifying the download and checksum.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            SHA256SUMS.txt

  cleanup:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time workflow
        run: |
          git config user.name 'SabotPress contributors'
          git config user.email 'sabotmedia@users.noreply.github.com'
          rm -f .github/workflows/build-publish-0.1.4.yml
          git add -A .github/workflows
          git commit -m 'remove one-time 0.1.4 workflow'
          git push origin HEAD:main
