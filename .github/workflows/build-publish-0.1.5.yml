name: build and publish 0.1.5

on:
  push:
    paths:
      - '.github/workflows/build-publish-0.1.5.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump patch version
        run: npm version 0.1.5 --no-git-tag-version
      - run: npm test
      - run: npm run build
      - run: npm run build:pwa
      - name: Commit release version
        run: |
          git config user.name 'Sabot Media'
          git config user.email 'info@sabot.media'
          git add package.json package-lock.json
          git commit -m 'release 0.1.5'
          git push origin HEAD:main
      - id: release_sha
        name: Record release commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tag release
        run: |
          git tag v0.1.5
          git push origin v0.1.5

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run desktop:dist:win -- --publish never
          - os: macos-latest
            command: npm run desktop:dist:mac -- --publish never
          - os: ubuntu-latest
            command: npm run desktop:dist:linux -- --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build SHA-256 checksum file
        run: |
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  artifacts/[^/]*/#  #' > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.5
          name: SabotPress 0.1.5
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            SHA256SUMS.txt
