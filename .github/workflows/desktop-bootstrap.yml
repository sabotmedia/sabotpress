name: verify desktop build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-bootstrap.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh dependencies
        run: npm install --package-lock-only
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build web app
        run: npm run build
      - name: Build Linux desktop package
        run: npx electron-builder --linux AppImage --x64 --publish never
      - name: Save lockfile
        run: |
          git config user.name 'sabotmedia'
          git config user.email 'sabotmedia@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refresh desktop dependencies'
          git pull --rebase origin main
          git push origin main
# smoke test pass
