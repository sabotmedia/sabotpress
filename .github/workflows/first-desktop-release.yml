name: first desktop release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/first-desktop-release.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows-x64
            command: npx electron-builder --win nsis portable --x64 --publish never
          - os: macos-latest
            name: macOS-arm64
            command: npx electron-builder --mac dmg zip --arm64 --publish never
          - os: macos-15-intel
            name: macOS-x64
            command: npx electron-builder --mac dmg zip --x64 --publish never
          - os: ubuntu-latest
            name: Linux-x64
            command: npx electron-builder --linux AppImage deb --x64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SabotPress-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          target_commitish: main
          name: SabotPress 0.1.0
          body: |
            First installable SabotPress desktop release.

            - Windows installer and portable build
            - macOS builds for Apple Silicon and Intel
            - Linux AppImage and Debian package
            - local SQLite publication database
            - local media storage
            - first-run publication setup
            - Publish Online guide with a zero-cost hosting path and optional custom domains

            These first desktop builds are unsigned, so Windows and macOS may show the usual publisher/security warning on first launch.
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
