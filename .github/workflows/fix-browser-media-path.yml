name: fix browser media scope

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-browser-media-path.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep local media inside the PWA scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/browserLocalApi.js')
          s = p.read_text()
          s = s.replace("url: `/__local_media/${encodeURIComponent(id)}`", "url: `./__local_media/${encodeURIComponent(id)}`")
          s = s.replace("publicUrl: `/__local_media/${encodeURIComponent(id)}`", "publicUrl: `./__local_media/${encodeURIComponent(id)}`")
          s = s.replace("downloadUrl: `/__local_media/${encodeURIComponent(id)}?download=1`", "downloadUrl: `./__local_media/${encodeURIComponent(id)}?download=1`")
          p.write_text(s)
          PY
          git config user.name 'SabotPress contributors'
          git config user.email 'sabotmedia@users.noreply.github.com'
          git add src/lib/browserLocalApi.js
          git commit -m 'fix browser local media paths'
          git push origin HEAD:main
