name: fix desktop first run and branding

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-desktop-first-run.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch routes, copy and desktop assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, base64

          app=Path('src/App.jsx')
          s=app.read_text()
          if "DesktopWelcomePage" not in s:
              s=s.replace("import { getPublicPageMeta } from './lib/publicPageRegistry'", "import { getPublicPageMeta } from './lib/publicPageRegistry'\nimport { DesktopWelcomePage } from './components/DesktopWelcomePage'\nimport { DesktopPublishOnlinePage } from './components/DesktopPublishOnlinePage'")
              s=s.replace("'/audiolab', '/settings', '/sites', '/wp-admin',", "'/audiolab', '/settings', '/sites', '/wp-admin', '/welcome', '/publish-online',")
              s=s.replace('<Route path="/login" element={<LoginPage />} />', '<Route path="/welcome" element={<DesktopWelcomePage />} />\n              <Route path="/publish-online" element={<DesktopPublishOnlinePage />} />\n              <Route path="/login" element={<LoginPage />} />')
          app.write_text(s)

          reg=Path('src/lib/editableContentRegistry.js')
          s=reg.read_text()
          replacements={
            'about / publication / harbor':'about / publication',
            'About SabotPress':'About this publication',
            'SabotPress publishes independent reporting, essays, comics, podcasts, zines, and project-based archive work rooted in Grays Harbor and connected to wider struggles.':'Add a description of your publication, collective, project, or archive here.',
            'Support SabotPress by reading, sharing, printing, citing, and circulating work from the archive. Direct support details can be added here when they are ready.':'Add the ways readers can support this publication here.',
            'Some people contact SabotPress with information that may carry personal, legal, professional, or political risk.':'Some people contact publications with information that may carry personal, legal, professional, or political risk.',
            'Use this key to encrypt email to SabotPress.':'Add your publication OpenPGP key here if you use one.',
            'Identity:\nSabotPress <>':'Identity:\nAdd your publication identity here.',
            'Fingerprint:\n3166 FF41 1CC8 71E7 2D15 344C AC26 8457 855E 57BA':'Fingerprint:\nAdd your OpenPGP fingerprint here.',
            'Key ID:\nAC268457855E57BA':'Key ID:\nAdd your key ID here.',
            'https://example.invalid/keys/info-sabot-media.asc':'',
            'Submit work':'Submit work',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace('submit@sabot.media','')
          reg.write_text(s)

          pkg=Path('package.json')
          p=json.loads(pkg.read_text())
          p['version']='0.1.1'
          p['build']['win']['icon']='public/sabotpress.ico'
          p['build']['mac']['icon']='public/sabotpress-icon.png'
          p['build']['linux']['icon']='public/sabotpress-icon.png'
          p['build']['win']['artifactName']='SabotPress-${version}-Windows-${arch}-${target}.${ext}'
          pkg.write_text(json.dumps(p,indent=2)+'\n')

          css=Path('src/sabotpress-setup.css')
          s=css.read_text() if css.exists() else ''
          s += '''\n.desktop-welcome{min-height:100vh;background:#111;color:#f5f5ee;padding:clamp(2rem,5vw,5rem);font-family:system-ui,sans-serif}.desktop-welcome__hero{max-width:920px;margin:0 auto 2rem}.desktop-welcome__mark{display:grid;place-items:center;width:84px;height:84px;border-radius:18px;background:#f5f5ee;color:#111;font-size:2rem;font-weight:900;margin-bottom:1.5rem}.desktop-welcome__eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:800;opacity:.72}.desktop-welcome h1{font-size:clamp(2.2rem,5vw,4.6rem);line-height:.98;letter-spacing:-.04em;max-width:900px}.desktop-welcome__hero>p:last-child{font-size:1.15rem;line-height:1.55;max-width:760px;opacity:.82}.desktop-welcome__steps{max-width:1080px;margin:0 auto 2rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}.desktop-welcome__steps>div{border:1px solid #444;padding:1rem;border-radius:12px;display:grid;gap:.35rem}.desktop-welcome__steps strong{font-size:1.5rem}.desktop-welcome .wp-meta-box{max-width:1080px;margin-left:auto;margin-right:auto;background:#f5f5ee;color:#111;border-radius:14px;padding:1.25rem}.desktop-welcome__footnote,.desktop-publish-online__actions{max-width:1080px;margin:1rem auto;opacity:.76}.desktop-publish-grid{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.desktop-publish-card{border:1px solid #444;border-radius:14px;padding:1.35rem;background:#191919}.desktop-publish-card--recommended{border-color:#f5f5ee}.desktop-publish-card__tag{display:inline-block;font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;margin-bottom:.5rem}.desktop-publish-card h2{margin:.25rem 0 .6rem}.desktop-publish-card li{margin:.45rem 0}.desktop-publish-online__actions{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}@media(max-width:760px){.desktop-welcome__steps,.desktop-publish-grid{grid-template-columns:1fr}.desktop-welcome{padding:1.25rem}}\n'''
          css.write_text(s)

          Path('public/sabotpress-icon.png').write_bytes(base64.b64decode('PLACEHOLDER_PNG'))
          Path('public/sabotpress.ico').write_bytes(base64.b64decode('PLACEHOLDER_ICO'))
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/fix-desktop-first-run.yml')
          PY
          npm install --package-lock-only --ignore-scripts
      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit fixes
        run: |
          git config user.name 'sabotmedia'
          git config user.email 'sabotmedia@users.noreply.github.com'
          git add src/App.jsx src/lib/editableContentRegistry.js src/sabotpress-setup.css package.json package-lock.json public/sabotpress-icon.png public/sabotpress.ico
          git commit -m 'fix desktop first run and generic branding'
          git push origin HEAD:main
