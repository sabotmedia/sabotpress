name: neutralize public defaults

on:
  push:
    branches: [main]
    paths: ['.github/workflows/neutralize-public-defaults.yml']

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove instance-shaped defaults
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ['src/routing/routes.js', 'src/components/PublicationTopbar.jsx', 'src/components/PublicationFooter.jsx', 'src/App.jsx']:
              p = Path(filename)
              s = p.read_text()
              s = s.replace('aiCampaignCoverage', 'featuredCampaignCoverage')
              s = s.replace('aiCampaign', 'featuredCampaign')
              s = s.replace('SHOW_AI_CAMPAIGN_LINKS', 'SHOW_FEATURED_CAMPAIGN_LINKS')
              s = s.replace("gallery: '/aberdeen-local-1312-gallery'", "gallery: '/gallery'")
              s = s.replace("'/aberdeen-local-1312-gallery':", "'/gallery':")
              s = s.replace('defaultLabel="A/I Campaign"', 'defaultLabel="Featured Campaign"')
              s = s.replace('defaultHref="/aberdeen-local-1312-gallery"', 'defaultHref="/gallery"')
              p.write_text(s)

          p = Path('src/config/campaignVisibility.js')
          p.write_text("// Optional direct link to one featured campaign. Generic campaign listings remain available separately.\nexport const SHOW_FEATURED_CAMPAIGN_LINKS = false\n")

          p = Path('src/lib/browserLocalApi.js')
          s = p.read_text()
          start = s.index('const DEFAULT_PUBLIC_CONFIG = {')
          end = s.index('\n}\n\nlet installed', start) + 2
          s = s[:start] + "const DEFAULT_PUBLIC_CONFIG = { text: {}, styles: {}, blocks: {} }" + s[end:]
          p.write_text(s)

          p = Path('src/components/PublicEditContext.jsx')
          s = p.read_text()
          s = s.replace("const isConfigReady = backendMode === 'd1' && loadState === 'loaded'", "const isConfigReady = ['d1', 'browser-local'].includes(backendMode) && loadState === 'loaded'")
          s = s.replace('// D1 is the only published source of truth. A legacy browser cache must not\n  // become the initial rendered site configuration, even briefly.', '// The active runtime authoritative store is the only published source of truth.\n  // Legacy browser caches never become public configuration implicitly.')
          p.write_text(s)

          p = Path('src/content/publicSiteDefaults.js')
          s = p.read_text()
          replacements = {
            "'home.archive.title': 'Browse imported pieces'": "'home.archive.title': 'Browse the archive'",
            "'home.native.eyebrow': 'native dispatches'": "'home.native.eyebrow': 'latest'",
            "'home.native.title': 'Published from inside Sabot'": "'home.native.title': 'Latest from this publication'",
            "'projects.hero.eyebrow': 'federation / lenses / routes'": "'projects.hero.eyebrow': 'projects / collections / series'",
            "'SabotPress is not one stream. It is a federation of smaller publishing routes, each with its own emphasis, rhythm, and medium.'": "'Group related work into projects, collections, or series with their own focus and format.'",
            "'Imported archive entries grouped under this publishing lane.'": "'Archive entries grouped under this project.'",
            "'There are currently no podcast-type pieces in the imported archive.'": "'There are currently no podcast episodes in this publication.'",
            "'Define the first native public content objects inside Sabot so publishing can move from imported archive toward a real internal system.'": "'Create and manage publication content directly inside SabotPress.'",
            "'Published native entries from inside Sabot. This is the first real public rendering lane for native content.'": "'Published updates created inside this publication.'",
            "'Operational surface for shaping imported content into a cleaner Sabot archive and future native publishing system.'": "'Operational surface for writing, editing, organizing, and publishing content.'",
            "'Browse public project lenses and verify archive distribution across Sabot’s publishing structure.'": "'Browse project groupings and verify how archive entries are organized.'",
            "'Move through archive cleanup, overrides, podcast enrichment, native publishing, and public rendering without relying on memory.'": "'Move through editing, review, media, publishing, and public verification without relying on memory.'",
            "'footer.about.body':\n      'An open collective of radical media makers working across writing, print, graphics, comics, newsletters, and broadcast.'": "'footer.about.body':\n      'Add a short description of this publication in site settings.'",
            "'Imported archive online. Native publishing and deeper tooling next.'": "'Publication status and notes can be edited in site settings.'",
            "'project.harbor-rat-report.title': 'The Example Project'": "'project.harbor-rat-report.title': 'Example Project'",
            "'project.harbor-rat-report.description': 'Essays, reports, history, and sharp local writing from the Harbor.'": "'project.harbor-rat-report.description': 'Example project description. Replace or remove this project.'",
            "'project.the-harbor-rat-report.title': 'The Example Project'": "'project.the-harbor-rat-report.title': 'Example Project'",
            "'project.the-harbor-rat-report.description': 'Essays, reports, history, and sharp local writing from the Harbor.'": "'project.the-harbor-rat-report.description': 'Example project description. Replace or remove this project.'",
            "'project.molotov-now.title': 'Example Project'": "'project.molotov-now.title': 'Example Audio Project'",
            "'project.molotov-now.description': 'Podcast episodes, audio dispatches, and broadcast-oriented media.'": "'project.molotov-now.description': 'Example podcast or audio project. Replace or remove this project.'",
            "'project.the-communique.title': 'The Communique'": "'project.the-communique.title': 'Example Newsletter'",
            "'project.the-communique.description': 'Newsletter-style writing, updates, and recurring dispatches.'": "'project.the-communique.description': 'Example newsletter or recurring series. Replace or remove this project.'",
            "'project.black-cat-distro.title': 'Black Cat Distro'": "'project.black-cat-distro.title': 'Example Print Project'",
            "'project.black-cat-distro.description': 'Zines, print material, posters, and physical publishing routes.'": "'project.black-cat-distro.description': 'Example zines, posters, and print work. Replace or remove this project.'",
            "'project.the-sabotuers.title': 'The Sabotuers'": "'project.the-sabotuers.title': 'Example Comics Project'",
            "'project.the-sabotuers.description': 'Comics, graphic storytelling, and image-forward narrative work.'": "'project.the-sabotuers.description': 'Example comics and graphic storytelling project. Replace or remove this project.'"
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: npm test
      - run: npm run build
      - run: npm run build:pwa
      - name: Commit cleanup
        run: |
          git config user.name 'SabotPress contributors'
          git config user.email 'sabotmedia@users.noreply.github.com'
          git add src
          git commit -m 'neutralize remaining publication defaults'
          git push origin HEAD:main
